<!DOCTYPE html>
<html>
<head>
    <title>EasyChat</title>
</head>
<body>

<h2>EasyChat WebSocket Demo</h2>

<input id="receiver" placeholder="Receiver username" />
<input id="message" placeholder="Message" />
<button onclick="sendMessage()">Send</button>

<ul id="messages"></ul>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    const token = localStorage.getItem("token");

    if (!token) {
        alert("JWT token not found in localStorage");
    }

    const socket = new SockJS('http://localhost:8080/easychat/ws-chat');
    const stompClient = Stomp.over(socket);

    stompClient.connect(
        { Authorization: "Bearer " + token },
        () => {
            stompClient.subscribe('/user/queue/messages', (msg) => {
                const message = JSON.parse(msg.body);
                const li = document.createElement('li');
                li.innerText = message.sender + ": " + message.content;
                document.getElementById('messages').appendChild(li);
            });
        }
    );

    function sendMessage() {
        const receiver = document.getElementById('receiver').value;
        const content = document.getElementById('message').value;

        stompClient.send("/app/chat.send", {}, JSON.stringify({
            receiver: receiver,
            content: content
        }));

        document.getElementById('message').value = "";
    }
</script>

</body>
</html>
